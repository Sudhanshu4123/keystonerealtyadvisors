name: 🚀 CD — Deploy Monorepo to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Monorepo to VPS
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚢 Deploy Monorepo to VPS via SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e

            echo "📁 Navigating to project directory..."
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "⬇️ Pulling latest code from GitHub..."
            git pull origin main

            echo "☕ Building Backend (Spring Boot)..."
            cd backend
            chmod +x mvnw
            ./mvnw clean package -DskipTests
            cd ..

            echo "📦 Building Frontend (Next.js)..."
            npm --prefix frontend ci
            npm --prefix frontend run build

            echo "📦 Building Admin (Next.js)..."
            npm --prefix admin ci
            npm --prefix admin run build

            echo "♻️ Restarting PM2 processes..."
            pm2 restart keystone-backend || pm2 start "java -jar backend/target/keystone-backend-1.0.0.jar" --name "keystone-backend"
            pm2 restart keystone-frontend || pm2 start npm --name "keystone-frontend" --prefix frontend -- start -- -p 3000
            pm2 restart keystone-admin || pm2 start npm --name "keystone-admin" --prefix admin -- start -- -p 3001

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "✅ Deployment complete!"
          ENDSSH
