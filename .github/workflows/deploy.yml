name: 🚀 CD — Deploy Monorepo to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Monorepo to VPS
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Check Secrets & Setup SSH Key
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "⚠️ VPS_HOST or VPS_SSH_KEY secrets are not configured in GitHub repository."
            echo "👉 To enable automatic deployment, go to: GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "👉 Add: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PROJECT_PATH"
            echo "SKIPPED=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p ${{ secrets.VPS_PORT || '22' }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚢 Deploy Monorepo to VPS via SSH
        if: steps.check_secrets.outputs.SKIPPED != 'true'
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.VPS_PORT || '22' }} -o StrictHostKeyChecking=no ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e

            echo "📁 Navigating to project directory..."
            PROJECT_DIR="${{ secrets.VPS_PROJECT_PATH || '/var/www/keystone' }}"
            mkdir -p "$PROJECT_DIR"
            cd "$PROJECT_DIR"

            echo "⬇️ Pulling latest code from GitHub..."
            git pull origin main || git clone https://github.com/Sudhanshu4123/keystonerealtyadvisors.git .

            echo "☕ Building Backend (Spring Boot)..."
            cd backend
            chmod +x mvnw || true
            ./mvnw clean package -DskipTests || mvn clean package -DskipTests
            cd ..

            echo "📦 Building Frontend (Next.js)..."
            npm --prefix frontend ci
            npm --prefix frontend run build

            echo "📦 Building Admin (Next.js)..."
            npm --prefix admin ci
            npm --prefix admin run build

            echo "♻️ Restarting PM2 processes..."
            pm2 restart keystone-backend || pm2 start "java -jar backend/target/keystone-backend-1.0.0.jar" --name "keystone-backend"
            pm2 restart keystone-frontend || pm2 start npm --name "keystone-frontend" --prefix frontend -- start -- -p 3000
            pm2 restart keystone-admin || pm2 start npm --name "keystone-admin" --prefix admin -- start -- -p 3001

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "✅ Deployment complete!"
          ENDSSH
