name: 🚀 CD — Deploy to Hostinger VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔧 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🏗️ Build Next.js App
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚢 Deploy to VPS via SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e

            echo "📁 Navigating to project directory..."
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "⬇️ Pulling latest code from GitHub..."
            git pull origin main

            echo "📦 Installing dependencies..."
            npm ci --production=false

            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo "📊 Running Prisma Database Migrations..."
            npx prisma db push

            echo "🌱 Seeding database (safe upsert mode)..."
            curl -s http://localhost:3000/api/seed || true

            echo "🏗️ Building production app..."
            npm run build

            echo "♻️ Restarting PM2 process..."
            pm2 reload keystone --update-env || pm2 start npm --name "keystone" -- start

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "✅ Deployment complete!"
          ENDSSH
