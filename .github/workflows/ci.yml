name: 🔍 CI — Lint, Type-check & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Type Check Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🏗️ Build Backend (Spring Boot)
        run: |
          cd backend
          chmod +x mvnw || true
          ./mvnw clean compile -DskipTests || mvn clean compile -DskipTests

      - name: 🏗️ Build Frontend (Next.js)
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: 🏗️ Build Admin (Next.js)
        run: |
          npm --prefix admin ci
          npm --prefix admin run build

      - name: ✅ Build Succeeded
        run: echo "Monorepo CI build completed successfully!"
